[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-modifier"
version = "0.1.0"
description = "Local Git helpers for distributing commit timestamps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=8.0",
]

[project.scripts]
git-modifier = "git_modifier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
