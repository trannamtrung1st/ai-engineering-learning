# Example Top Down Planning configuration (proposal §14).
#
# From the repository root (project.workspace: . resolves against cwd):
#   tdp run --config tools/top_down_planning/examples/top-down-planning.yaml
#
# Path resolution:
#   project.workspace resolves against the process working directory.
#   run.input_refs, run.output_goal_file, and all
#   agent_context resources/skills resolve against project.workspace.
#   runtime.runs_dir continues to resolve against the process working directory.
#
# Stub provider is for scripted tests only (provider.name=stub + script_turn()).
# Agent discoverability:
#   tdp agent help
#   tdp agent readme
#   tools/top_down_planning/docs/README.md
#   Packaged skills auto-injected (agent_context.bundled_skills, default true)
#
# Run store (optional):
#   Precedence: --runs-dir > $TDP_RUNS_DIR > runtime.runs_dir > ./runs
version: 1

runtime:
  runs_dir: .tdp/runs

project:
  workspace: .

run:
  input_refs:
    - tools/top_down_planning/README.md
  output_goal: "Produce the requested project output while preserving the declared scope and satisfying the approved plan."
  # Alternatively, use a file-backed goal (mutually exclusive with output_goal):
  # output_goal_file: tools/top_down_planning/examples/output-goal.md
  boundaries: []
  acceptance: []

# Snapshot exclusions (default-on when this section is omitted).
# Built-ins cover __pycache__, *.py[cod], and common tool caches.
# User patterns use gitignore/gitwildmatch order; .gitignore is not inherited.
# Exclusion policy is part of context_spec identity. See package README.
context_snapshot:
  excludes:
    defaults: true
    patterns: []

agent_context:
  default:
    model: auto
    resources: []

  roles:
    planner:
      model: auto
      resources: []
    producer:
      model: auto
      resources: []
    reviewer:
      model: auto
      resources: []

  activities:
    initial_plan:
      model: auto
    plan_revision:
      model: auto
    plan_amendment:
      model: auto
    production:
      model: auto
    output_revision:
      model: auto
    initial_review:
      model: auto
    finding_verification:
      model: auto
    scope_review:
      model: auto

planning:
  stop_hint: "Stop when each item has one coherent outcome, clear boundaries, material dependencies, and acceptance expectations."
  max_depth: 2
  max_expansion_per_item: 12

review:
  focused_plan:
    enabled: true
  focused_output:
    enabled: true
  whole_plan:
    rubric:
      - "Hierarchy: Is every child a genuine decomposition of its parent outcome?"
      - "Dependencies: Is every dependency a real execution prerequisite?"
      - "Granularity: Does each item represent a coherent executable outcome?"
      - "Contract ownership: Are acceptance criteria attached to the implementing item?"
      - "Plan cleanliness: Does the active plan contain only current work?"
      - "Coverage: Does the plan address all material requirements?"
      - "Traceability: Can each acceptance criterion be traced to a planned outcome?"

observability:
  log_level: normal
  log_format: console
  color: auto
  show_agent_text: true
  agent_transcript: false
  # Optional stderr truncation (unlimited when omitted):
  # max_message_length: 500
  # max_tool_summary_length: 120

provider:
  name: cursor
  # binary: /path/to/agent
  # skip_probe: false

limits:
  planning:
    max_items_added: 20
    max_agent_turns: 40
  focused_plan_review:
    max_loops: 5
    max_revision_cycles_per_loop: 3
  whole_plan_review:
    max_revision_cycles: 5
    max_scope_review_rounds: 3
  production:
    max_batches: 50
    max_agent_turns_per_batch: 10
  focused_output_review:
    max_loops: 8
    max_revision_cycles_per_loop: 3
  whole_output_review:
    max_revision_cycles: 5
    max_scope_review_rounds: 3
  amendment:
    max_requests: 3
    max_revision_cycles_per_request: 3
  review:
    max_agent_turns_per_gate: 5
  provider:
    max_retries_per_call: 2
    turn_idle_timeout_seconds: 2  # seconds without stream-json stdout; 0 = opt out
