# Example Top Down Planning configuration (proposal §14).
#
# User CLI:
#   tdp run --config examples/top-down-planning.yaml
#
# Stub provider is for scripted tests only (provider.name=stub + script_turn()).
# Agent discoverability:
#   tdp agent help
#   tdp agent schema config
#   tdp agent example expand-branch
version: 1

run:
  input_refs:
    - README.md
  output_goal: "Produce the requested project output while preserving the declared scope and satisfying the approved plan."
  boundaries: []
  acceptance: []

planning:
  stop_hint: "Stop when each item has one coherent outcome, clear boundaries, material dependencies, and acceptance expectations."
  max_depth: 4
  max_expansion_per_item: 7

review:
  focused_plan:
    enabled: true
  whole_plan:
    required: true
  focused_output:
    enabled: true
  whole_output:
    required: true

provider:
  name: cursor
  use_native_project_context: true
  # model: composer-2.5
  # binary: /path/to/agent
  # skip_probe: false

limits:
  planning:
    max_expansion_iterations: 20
    max_agent_turns: 40
  focused_plan_review:
    max_loops: 5
    max_revision_cycles_per_loop: 3
  whole_plan_review:
    max_revision_cycles: 5
  production:
    max_batches: 50
    max_agent_turns_per_batch: 10
  focused_output_review:
    max_loops: 8
    max_revision_cycles_per_loop: 3
  whole_output_review:
    max_revision_cycles: 5
  amendment:
    max_requests: 3
    max_revision_cycles_per_request: 3
