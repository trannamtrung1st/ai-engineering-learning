# Example Top Down Planning configuration (proposal §14).
#
# From the repository root:
#   tdp run --config tools/top_down_planning/examples/top-down-planning.yaml
#
# Path resolution:
#   project.workspace resolves against the process working directory.
#   project.resources, run.input_refs, run.output_goal_file, and all
#   agent_context resources/skills resolve against project.workspace.
#   runtime.runs_dir continues to resolve against the process working directory.
#
# Stub provider is for scripted tests only (provider.name=stub + script_turn()).
# Agent discoverability:
#   tdp agent help
#   tdp agent schema config
#   tdp agent example expand-branch
#
# Run store (optional):
#   Precedence: --runs-dir > $TDP_RUNS_DIR > runtime.runs_dir > ./runs
version: 1

runtime:
  runs_dir: .tdp/runs

project:
  workspace: .
  resources: []

run:
  input_refs:
    - tools/top_down_planning/README.md
  output_goal: "Produce the requested project output while preserving the declared scope and satisfying the approved plan."
  # Alternatively, use a file-backed goal (mutually exclusive with output_goal):
  # output_goal_file: tools/top_down_planning/examples/output-goal.md
  boundaries: []
  acceptance: []

agent_context:
  default:
    model: auto
    resources: []
    skills: []

  planner:
    model: auto
    resources: []
    skills: []

  producer:
    model: auto
    resources: []
    skills: []

  reviewer:
    model: auto
    resources: []
    skills: []

planning:
  stop_hint: "Stop when each item has one coherent outcome, clear boundaries, material dependencies, and acceptance expectations."
  max_depth: 4
  max_expansion_per_item: 7

review:
  focused_plan:
    enabled: true
  whole_plan:
    required: true
  focused_output:
    enabled: true
  whole_output:
    required: true

provider:
  name: cursor
  # binary: /path/to/agent
  # skip_probe: false

limits:
  planning:
    max_expansion_iterations: 20
    max_agent_turns: 40
  focused_plan_review:
    max_loops: 5
    max_revision_cycles_per_loop: 3
  whole_plan_review:
    max_revision_cycles: 5
  production:
    max_batches: 50
    max_agent_turns_per_batch: 10
  focused_output_review:
    max_loops: 8
    max_revision_cycles_per_loop: 3
  whole_output_review:
    max_revision_cycles: 5
  amendment:
    max_requests: 3
    max_revision_cycles_per_request: 3
