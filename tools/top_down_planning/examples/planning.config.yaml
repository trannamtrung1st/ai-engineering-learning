# Example planning run config.
#
# Run:
#   top-down-planning --config ./examples/planning.config.yaml
#
# Requires top-down-planning 0.1.0+ and cursor-agent on PATH (authenticated).
#
# Contract discovery:
#   top-down-planning usage
#   planning-plan-tool schema --target transaction
#   planning-plan-tool usage
#   planning-render-tool --help
#   planning-review-tool schema --stage whole_plan_review
#
# Planning sessions: choose batch scope with planning-plan-tool select-batch,
# record operations, then finalize. Render uses planning-render-tool select-batch
# for agent-selected sequential batches. Structural graph completion precedes
# whole-plan review and final confirmation.
#
# CLI flags override values from this file. Paths are resolved relative to
# `workspace` (or this file's directory when `workspace` is `.` or omitted),
# unless absolute.
#
# Required for a new run: input, output, and one of output_goal / output_goal_file.

# --- Primary inputs (required) ------------------------------------------------

input: ./idea.md
output: ./planning-output
workspace: .

# Use either output_goal (inline) or output_goal_file (not both).
# output_goal: Produce an actionable implementation plan.
output_goal_file: ./output-goal.md

# Optional guidance for when to stop expanding vs mark items actionable.
# Use either stop_hint (inline) or stop_hint_file (not both).
stop_hint: |
  Stop expanding once each major workstream has actionable leaf tasks.
  Prefer marking items actionable over further expansion when details are
  sufficient for the output goal.
# stop_hint_file: ./stop-hint.md

# --- Planning limits ----------------------------------------------------------

limits:
  max_iterations: 50
  max_depth: 6 # default: 6 — deepest plan item depth (root is 0)
  max_children_per_expansion: 12 # default: 12 — max direct children per expand
  max_retries: 2
  # session_timeout_seconds: 600 # default: 600 — Cursor agent session timeout
  # parse_error_threshold: 20 # default: 20 — stream parse errors before abort

# Planning iterations always reference a digest-addressed plan-overview artifact
# under <output>/.planning-output/context/ (no generation config block).

# --- Review gate (optional) ---------------------------------------------------

review:
  enabled: true
  max_revision_cycles: 2
  max_retries: 2

# --- Render (post-confirmation) ------------------------------------------------
# Sequential cumulative authoring: scaffold → agent-selected batches → final review.

render:
  max_retries: 2
  final_review: true
  max_batch_revision_cycles: 2
  max_final_revision_cycles: 2
  scaffold: true
  # Gitignore-style patterns excluded from workspace snapshot diffing and artifact_paths.
  # Canonical planning state under <output>/.planning-output/ is always excluded.
  artifact_ignore_patterns:
    - "**/__pycache__/"
    - "**/.pytest_cache/"
    - "**/.mypy_cache/"
    - "**/.ruff_cache/"
    - "**/.tox/"
    - "**/node_modules/"
    - "**/.eggs/"
    - "**/build/"
    - "**/dist/"
    - "*.pyc"
    - "*.pyo"
    - "**/.DS_Store"

# --- Cursor agent client ------------------------------------------------------

agent_bin: cursor-agent
# model: composer-2.5 # default: composer-2.5; env: PLANNING_TOOL_MODEL
# skip_probe: false
# embed_threshold: 4000 # env: PLANNING_TOOL_EMBED_THRESHOLD

# --- Run behavior (optional) --------------------------------------------------

# resume: false
# stream_json: false
# no_color: false
# notify: true

agent_context:
  default:
    model: composer-2.5
    skills:
      - ./.cursor/skills/example-shared/SKILL.md
    rules:
      - ./.cursor/rules/example-shared.mdc
  planning:
    skills:
      - ./.cursor/skills/example-planning/SKILL.md
  rendering:
    skills:
      - ./.cursor/skills/example-rendering/SKILL.md
    rules:
      - ./.cursor/rules/example-rendering.mdc
  review:
    skills:
      - ./.cursor/skills/example-shared/SKILL.md
    rules:
      - ./.cursor/rules/example-shared.mdc
