[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "top-down-planning"
version = "0.1.0"
description = "Generic top-down planning tool using Cursor Agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "notify-py>=0.3.43,<0.4",
  "pathspec>=0.12",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
top-down-planning = "top_down_planning.cli:app"
planning-plan-tool = "top_down_planning.plan_tool:main"
planning-render-tool = "top_down_planning.render_tool:main"
planning-review-tool = "top_down_planning.review_tool:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "live: requires an authenticated live Cursor Agent CLI",
]
