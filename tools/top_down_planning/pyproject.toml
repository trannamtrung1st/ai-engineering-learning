[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "top-down-planning"
version = "0.1.0"
description = "Generic agent orchestration for top-down planning and production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=8.0",
]

[project.scripts]
tdp = "top_down_planning.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not integration"]
markers = [
  "integration: multi-layer smoke tests (config, CLI, orchestrator, persistence).",
]
