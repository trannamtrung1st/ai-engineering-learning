[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "top-down-planning"
version = "0.1.0"
description = "Generic agent orchestration for top-down planning and production"
readme = "README.md"
requires-python = ">=3.11"
# Cross-process run ownership uses POSIX flock on a persistent sentinel inode;
# Windows is not supported for multi-process resume locking. Without /proc,
# legacy pid:unknown metadata is conservative-only (flock remains authoritative).
dependencies = [
  "core-tools @ file:../core_tools",
  "jinja2>=3.1",
  "pathspec>=0.12",
]

[project.optional-dependencies]
notifications = [
  "notify-py>=0.3.43,<0.4",
]
dev = [
  "build",
  "hatchling",
  "pytest>=8.0",
  "pytest-xdist>=3.8",
]

[project.scripts]
tdp = "top_down_planning.cli.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/top_down_planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not integration", "-n", "auto", "--dist", "worksteal"]
markers = [
  "integration: stub-provider e2e and multi-layer smoke tests.",
]
