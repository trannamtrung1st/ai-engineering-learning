# Example todos-tool run config.
#
# Run:
#   todos-tool validate --workspace examples
#   todos-tool status --workspace examples
#   todos-tool run --config ./examples/run.config.yaml --workspace examples
#
# Item YAML includes optional checklists ({id, text, done}) as agent-owned work plans.
# Cross-item checklist transfers use checklist_moves in restructure-proposal.json.
#
# CLI flags override values from this file. Paths are resolved relative to
# `workspace` (or this file's directory when `workspace` is `.` or omitted),
# unless absolute.

workspace: .
todos_dir: todos

commit_hint: |
  When the review passes, propose a full commit subject like:
  - feature items: `agent: feat: <concise subject>`
  - fix items: `agent: fix: <concise subject>`
  - refactor items: `agent: refactor: <concise subject>`

context:
  files:
    - path: README.md
      required: false
  instructions:
    - Follow the repository's existing architecture and naming conventions.

authority:
  forbidden_path_globs: []

evidence:
  required_commands:
    - pytest
  forbidden_command_patterns: []

git:
  commit_prefix: "agent:"

agent_context:
  default:
    skills:
      - .cursor/skills/example-shared/SKILL.md
    rules:
      - .cursor/rules/example-shared.mdc
  implement:
    model: composer-2.5
    skills:
      - .cursor/skills/example-implement/SKILL.md
  review:
    model: gpt-5.6-sol-high
    skills:
      - .cursor/skills/example-review/SKILL.md

