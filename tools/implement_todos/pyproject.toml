[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todos-tool"
version = "0.1.0"
description = "Generic TODO execution tool using Cursor Agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "notify-py>=0.3.43,<0.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "build",
  "pydantic>=2.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
todos-tool = "todos_tool.cli:run"
todos-review-tool = "todos_tool.review_tool:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "live: requires an authenticated live Cursor Agent CLI",
]
