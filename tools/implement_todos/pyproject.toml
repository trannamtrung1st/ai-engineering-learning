[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todos-tool"
version = "0.1.0"
description = "Generic TODO execution tool using Cursor Agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
todos-tool = "todos_tool.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
