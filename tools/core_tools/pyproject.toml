[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-tools"
version = "0.1.0"
description = "Shared infrastructure for agent orchestration tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
