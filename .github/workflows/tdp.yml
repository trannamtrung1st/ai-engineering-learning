name: TDP

on:
  push:
    paths:
      - "tools/top_down_planning/**"
      - "tools/core_tools/**"
      - ".github/workflows/tdp.yml"
  pull_request:
    paths:
      - "tools/top_down_planning/**"
      - "tools/core_tools/**"
      - ".github/workflows/tdp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install editable monorepo packages
        run: |
          python -m pip install --upgrade pip
          cd tools/top_down_planning
          python -m pip install -e ../core_tools
          python -m pip install -e ".[dev]"

      - name: Build offline packaging wheelhouse
        id: wheelhouse
        run: |
          WHEELHOUSE="${RUNNER_TEMP}/tdp-packaging-wheelhouse"
          python tools/top_down_planning/scripts/build_packaging_wheelhouse.py "$WHEELHOUSE"
          echo "path=$WHEELHOUSE" >> "$GITHUB_OUTPUT"

      - name: Syntax gate
        run: python -m compileall -q tools/top_down_planning/src tools/core_tools/src

      - name: Unit tests
        run: |
          cd tools/top_down_planning
          python -m pytest

      - name: Integration tests
        env:
          TDP_PACKAGING_WHEELHOUSE: ${{ steps.wheelhouse.outputs.path }}
        run: |
          cd tools/top_down_planning
          python -m pytest -m integration

      - name: Review-plan full no-addopts gate
        if: matrix.python-version == '3.13'
        env:
          TDP_PACKAGING_WHEELHOUSE: ${{ steps.wheelhouse.outputs.path }}
        run: |
          cd tools/top_down_planning
          python -m pytest -o addopts='' tests

      - name: Wheel build gate
        run: python -m build --wheel tools/top_down_planning

      - name: core_tools unit tests
        run: |
          cd tools/core_tools
          python -m pip install -e ".[dev]"
          python -m pytest \
            --ignore=tests/unit/test_process_cleanup.py \
            --ignore-glob='tests/unit/test_slice5_rereview*_fixes.py'
          python -m pytest -n 0 \
            tests/unit/test_process_cleanup.py \
            tests/unit/test_slice5_rereview*_fixes.py

  darwin-janitor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: core_tools Darwin janitor tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "tools/core_tools[dev]"
          cd tools/core_tools
          python -m pytest -n 0 \
            tests/unit/test_process_cleanup.py \
            tests/unit/test_slice5_rereview*_fixes.py
