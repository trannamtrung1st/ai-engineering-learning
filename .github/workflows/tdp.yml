name: TDP

on:
  push:
    paths:
      - "tools/top_down_planning/**"
      - "tools/core_tools/**"
      - ".github/workflows/tdp.yml"
  pull_request:
    paths:
      - "tools/top_down_planning/**"
      - "tools/core_tools/**"
      - ".github/workflows/tdp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install editable monorepo packages
        run: |
          python -m pip install --upgrade pip
          cd tools/top_down_planning
          python -m pip install -e ../core_tools
          python -m pip install -e ".[dev]"

      - name: Build offline packaging wheelhouse
        id: wheelhouse
        run: |
          WHEELHOUSE="${RUNNER_TEMP}/tdp-packaging-wheelhouse"
          python tools/top_down_planning/scripts/build_packaging_wheelhouse.py "$WHEELHOUSE"
          echo "path=$WHEELHOUSE" >> "$GITHUB_OUTPUT"

      - name: Syntax gate
        run: python -m compileall -q tools/top_down_planning/src tools/core_tools/src

      - name: Unit tests
        run: |
          cd tools/top_down_planning
          python -m pytest

      - name: Integration tests
        run: |
          cd tools/top_down_planning
          python -m pytest -m integration

      - name: Review-plan full no-addopts gate
        if: matrix.python-version == '3.13'
        env:
          TDP_PACKAGING_WHEELHOUSE: ${{ steps.wheelhouse.outputs.path }}
        run: |
          cd tools/top_down_planning
          python -m pytest -o addopts='' tests

      - name: Packaging install smoke
        env:
          TDP_PACKAGING_WHEELHOUSE: ${{ steps.wheelhouse.outputs.path }}
          TDP_SLICE10_FREEZE: "1"
        run: |
          cd tools/top_down_planning
          python -m pytest -o addopts='' -m packaging --tb=short
          python -m pytest -o addopts='' -p no:xdist \
            tests/unit/test_slice10_scenario_matrix.py::test_slice10_installed_artifact_gate_executes_when_freeze_requested

      - name: Wheel build gate
        run: python -m build --wheel tools/top_down_planning

      - name: core_tools unit tests
        run: |
          cd tools/core_tools
          python -m pip install -e ".[dev]"
          python -m pytest \
            --ignore=tests/unit/test_process_cleanup.py \
            --ignore-glob='tests/unit/test_slice5_rereview*_fixes.py'

  linux-process-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core_tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "tools/core_tools[dev]"

      - name: Isolated buffered-drain reproducer
        env:
          TDP_TRACE_PROCESS_SIGNALS: "1"
        run: |
          cd tools/core_tools
          python -m pytest -p no:xdist -o addopts='' --tb=short -s \
            tests/unit/test_slice5_rereview_b8a5a80_fixes.py::test_zero_budget_still_drains_buffered_final_line

      - name: Isolated stream-framing iterator tests
        env:
          TDP_TRACE_PROCESS_SIGNALS: "1"
        run: |
          cd tools/core_tools
          python -m pytest -p no:xdist -o addopts='' --tb=short -s \
            tests/unit/test_slice5_rereview_c67af97_fixes.py

      - name: Serial process-lifecycle tests
        env:
          TDP_TRACE_PROCESS_SIGNALS: "1"
          TDP_GROUP_SIGNAL_LOG: ${{ runner.temp }}/tdp-group-signals.jsonl
        run: |
          cd tools/core_tools
          set +e
          python -m pytest -p no:xdist -o addopts='' --tb=short -s \
            tests/unit/test_process_cleanup.py \
            tests/unit/test_slice5_rereview*_fixes.py
          status=$?
          if [ -f "$TDP_GROUP_SIGNAL_LOG" ]; then
            echo "---- TDP_GROUP_SIGNAL_LOG ----"
            cat "$TDP_GROUP_SIGNAL_LOG" || true
          fi
          exit "$status"

  darwin-janitor:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          cd tools/top_down_planning
          python -m pip install -e "../core_tools[dev]"
          python -m pip install -e ".[dev]"

      - name: Isolated buffered-drain reproducer
        env:
          TDP_TRACE_PROCESS_SIGNALS: "1"
        run: |
          cd tools/core_tools
          python -m pytest -p no:xdist -o addopts='' --tb=short -s \
            tests/unit/test_slice5_rereview_b8a5a80_fixes.py::test_zero_budget_still_drains_buffered_final_line

      - name: core_tools Darwin janitor tests
        run: |
          cd tools/core_tools
          python -m pytest -p no:xdist -o addopts='' --tb=short \
            tests/unit/test_process_cleanup.py \
            tests/unit/test_slice5_rereview*_fixes.py

      - name: TDP Darwin orphan cleanup
        run: |
          cd tools/top_down_planning
          python -m pytest -p no:xdist -o addopts='' --tb=short \
            tests/unit/test_slice5_rereview_27bf8d7_fixes.py

      - name: TDP Darwin real CLI cancellation
        run: |
          cd tools/top_down_planning
          python -m pytest -p no:xdist -o addopts='' --tb=short \
            tests/unit/test_cli_os_process_cancel.py
